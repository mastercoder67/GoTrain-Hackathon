[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gotrain-hackathon"
version = "0.1.0"
description = "Auditable autonomous geospatial model training with Strands"
requires-python = ">=3.12"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "geobench==1.1.0",
  "strands-agents==1.63.0", "numpy>=1.26,<3", "pillow>=10",
  "huggingface-hub>=0.19", "boto3>=1.26", "mcp>=1.8,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gotrain*"]

[tool.setuptools.package-data]
gotrain = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
